# 依赖自动升级：Dependabot 每周检查一次，有新版本就开 PR，PR 走和平时一样的检查和审查。
# 提交信息前缀设成 build 和 ci，带上范围，生成的是 "build(deps): bump ..."，符合 Conventional Commits。
# 小版本和补丁版本合成一个 PR，大版本单独开 PR，因为大版本常有不兼容的改动，需要单独看升级说明。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # pnpm 工作区：根目录一条 npm 生态的配置覆盖 apps/* 和 libs/*。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
