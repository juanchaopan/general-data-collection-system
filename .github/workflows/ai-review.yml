name: ai-review

# 每个 PR 的风险分级、AI 代码审查和人工确认关卡。
#   risk          按 .github/risk-rules.txt 给 PR 定级并打标签。规则从目标分支读取，PR 改不了自己的等级。
#   claude-review Claude 对照 CLAUDE.md、REVIEW.md、.claude/rules/ 和 PR 描述审查改动，问题以行内评论发出。
#                 分支规则要求所有评论线程处理完才能合并，所以每条意见都得修掉或写明理由后关闭。
#                 超过 MAX_ROUNDS 轮就停止自动审查，提醒作者重新考虑做法。
#                 不审查的 PR：发布 PR（release/*）和从 main、master 回合并的 PR，它们只包含已经审查过的代码；
#                 来自 fork 和 Dependabot 的 PR，GitHub 不给它们访问密钥。维护者需要时，在 PR 里评论 @claude 请它审查。
#   risk-gate     中、高风险的 PR 必须带 human-reviewed 标签才通过。分支规则把它设为必需检查。
# 加减标签只重新运行 risk 和 risk-gate，不会重新触发 AI 审查。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'labels' || 'code' }}
  cancel-in-progress: true

jobs:
  risk:
    name: risk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      approved: ${{ steps.classify.outputs.approved }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - id: classify
        run: node .github/scripts/risk-classify.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

  claude-review:
    name: claude-review
    needs: risk
    if: >-
      ${{
        github.event.action != 'labeled' && github.event.action != 'unlabeled' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'release/') &&
        github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'master'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
      id-token: write
    env:
      MAX_ROUNDS: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 收集已有的审查意见和轮次
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .ai-review-context
          gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq '.[] | "- \(.path):\(.line // .original_line // "?") \(.body | split("\n")[0])"' \
            > .ai-review-context/previous-comments.md
          done_rounds=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- ai-review-summary -->")) | .id' | wc -l)
          echo "round=$((done_rounds + 1))" >> "$GITHUB_OUTPUT"
          if [ "$done_rounds" -ge "$MAX_ROUNDS" ]; then
            echo "capped=true" >> "$GITHUB_OUTPUT"
          else
            echo "capped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 达到审查轮数上限时提醒
        if: ${{ steps.context.outputs.capped == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -q '<!-- ai-review-capped -->'; then
            body=$(printf '%s\n%s' '<!-- ai-review-capped -->' \
              "AI 审查已经进行了 $MAX_ROUNDS 轮，问题还没收敛，自动审查暂停。建议重新考虑做法：把 PR 拆小，或者换一种实现。还想继续审查的话，在本地运行 code-review。")
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body"
          fi

      - name: Claude 审查
        if: ${{ steps.context.outputs.capped != 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            仓库：${{ github.repository }}
            PR 编号：${{ github.event.pull_request.number }}
            风险等级：${{ needs.risk.outputs.tier }}
            审查轮次：第 ${{ steps.context.outputs.round }} 轮（上限 ${{ env.MAX_ROUNDS }} 轮）
            新增提交范围：${{ github.event.before }}..${{ github.event.after }}（只在 PR 收到新提交时有值）

            你是这个仓库的代码审查员。按下面的步骤审查这个 PR。

            1. 读 CLAUDE.md（项目规范）、REVIEW.md（审查标准），以及 `.claude/rules/` 里和改动文件相关的规范。冲突时以 REVIEW.md 为准，评论语言也按 REVIEW.md。
            2. 用 `gh pr view` 读 PR 描述和关联的 issue，弄清这次改动想做什么；用 `gh pr diff` 看改动。需要时阅读仓库里的其他代码和 docs/ 下的需求、架构、设计文档，弄清改动和整个项目的关系。修 bug 的改动，要检查是否修到了根因。
            3. 按风险等级决定审查深度：
               - low：只确认没有明显错误。
               - medium：完整检查逻辑、错误处理、测试和分层。
               - high：逐项推演边界条件、并发、失败路径、数据丢失和回滚方式，宁可多花时间。
            4. 如果不是第一轮：先读 `.ai-review-context/previous-comments.md`，里面是已经发过的行内意见，不要重复提。重点审查上面的新增提交范围（用 `git diff 起..止` 查看），除非新改动影响到了别处的代码。
            5. 只报真实问题：逻辑错误、和 PR 描述或 issue 验收标准不符、违反 CLAUDE.md 或 `.claude/rules/` 的约定（包括分层）、违背 docs/adr/ 里已接受的架构决策、REVIEW.md「补丁味和臃肿」里列的问题、CLAUDE.md 里已经和代码对不上的内容。纯格式和风格问题交给 lint，不要报。每条问题发出前先自己验证：能指出文件、行号和触发条件才报，只凭名字猜测的不报。
            6. 每条问题用 `mcp__github_inline_comment__create_inline_comment` 发在对应的行上，开头标注 [Important]、[Nit] 或 [Pre-existing]（这次改动之前就有的问题）。同一类问题出现在多处时，在第一处列出全部位置，要求一起修。
            7. 最后用 `gh pr comment` 发一条总结。总结第一行原样写 `<!-- ai-review-summary -->`，第二行以"发现 N 个问题"开头；没有问题就写"发现 0 个问题，无需修改"。总结里写明风险等级和轮次。
            8. 不要批准 PR，不要修改或提交代码。
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

  risk-gate:
    name: risk-gate
    needs: risk
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TIER: ${{ needs.risk.outputs.tier }}
          APPROVED: ${{ needs.risk.outputs.approved }}
        run: |
          if [ "$TIER" = "low" ]; then
            echo "低风险，不需要人工确认。"
          elif [ "$APPROVED" = "true" ]; then
            echo "风险等级 $TIER，已经人工确认。"
          else
            echo "::error::风险等级 $TIER：请亲自读完这次提交的改动，确认没问题后给 PR 加上 human-reviewed 标签（已经有这个标签、但之后又有新提交时，先去掉再加上）。"
            exit 1
          fi
